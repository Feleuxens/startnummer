[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "startnummer"
version = "0.1.0"
description = "Automatic tagging and description of track-and-field photos by bib number and face."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"

# Core dependencies.
dependencies = [
    "pydantic==2.13.4",
]

[project.optional-dependencies]
db = [
    "sqlalchemy==2.0.51",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.5",
]

# API and review UI.
api = [
    "startnummer[db]",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.50.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "xxhash==3.8.1",
    "beautifulsoup4==4.15.0",
    "pillow==12.3.0",
    "pymysql==1.2.0",
    "python-multipart>=0.0.20,<1",
    "python-dotenv==1.2.2",
    "cryptography==49.0.0",
    "psutil==7.2.2",
    "argon2-cffi==25.1.0",
]

# Queue/review service. Select one device extra to run inference.
worker = [
    "startnummer[db]",
    "beautifulsoup4==4.15.0",
    "pillow==12.3.0",
    "httpx==0.28.1",
    "psutil==7.2.2",
]

# Shared model adapters; device extras supply exactly one ONNX Runtime.
model-common = [
    "startnummer[worker]",
    "numpy==2.3.5",
    "opencv-python==4.13.0.92",
    "ultralytics==8.4.87",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "rapidocr==3.9.1",
    "insightface==1.0.1",
]
cpu = ["startnummer[model-common]", "torch==2.12.1", "torchvision==0.27.1", "onnxruntime==1.27.0"]
intel = [
    "startnummer[model-common]",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "onnxruntime==1.27.0",
    "openvino==2026.4.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
nvidia = [
    "startnummer[model-common]",
    "onnxruntime-gpu==1.27.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
apple = [
    "startnummer[model-common]",
    "onnxruntime==1.27.0",
    "coremltools==9.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Compatibility aliases. New installations should select a device explicitly.
inference = ["startnummer[cpu]"]
face = ["startnummer[cpu]"]

# Bib-number OCR
ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.2.2",
    "rapidocr==3.9.1",
    "rapidocr-onnxruntime==1.4.4",
]

# Optional vision-language model dependencies.
vlm = [
    "transformers==5.12.1",
    "torch",
    "accelerate==1.14.0",
]

[project.scripts]
startnummer = "startnummer.app.manage:main"
startnummer-worker = "startnummer.app.worker:main"
startnummer-api = "startnummer.app.api:main"

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "pytest==9.1.1",
    "import-linter==2.13",
    "mypy==2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["startnummer"]

# Enforces the inward-dependency rule: app -> adapters -> core, never the reverse.
[tool.importlinter]
root_package = "startnummer"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "startnummer.app",
    "startnummer.adapters",
    "startnummer.core",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
conflicts = [[{extra = "cpu"}, {extra = "intel"}, {extra = "nvidia"}, {extra = "apple"}]]

# InsightFace names the CPU distribution although both wheels provide onnxruntime.
# The device extras supply the runtime; keep this metadata tied to the pinned version.
[[tool.uv.dependency-metadata]]
name = "insightface"
version = "1.0.1"
requires-dist = ["numpy", "onnx", "opencv-python", "requests", "scikit-image", "scipy", "tqdm"]

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'"},
    {index = "pytorch-cpu", extra = "intel", marker = "sys_platform == 'linux'"},
]
torchvision = [
    {index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'"},
    {index = "pytorch-cpu", extra = "intel", marker = "sys_platform == 'linux'"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
