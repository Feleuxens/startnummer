[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "startnummer"
version = "0.1.0"
description = "Automatic tagging and description of track-and-field photos by bib number and face."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"

# Core dependencies.
dependencies = [
    "pydantic==2.13.4",
]

[project.optional-dependencies]
db = [
    "sqlalchemy==2.0.51",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.5",
]

# API and review UI.
api = [
    "startnummer[db]",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.50.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "xxhash==3.8.1",
    "beautifulsoup4==4.15.0",
    "pillow==12.3.0",
    "pymysql==1.2.0",
    "python-multipart>=0.0.20,<1",
    "python-dotenv==1.2.2",
    "cryptography==49.0.0",
]

# Analysis worker. Add the ocr and face extras for inference.
worker = [
    "startnummer[db]",
    "beautifulsoup4==4.15.0",
    # numpy pinned because of paddleocr's requirement
    "numpy==2.3.5",
    "pdfplumber==0.11.10",
    "pillow==12.3.0",
    "opencv-python-headless==5.0.0.93",
    "ultralytics==8.4.87",
    "torch==2.12.1",
    "httpx==0.28.1",
    "pymysql==1.2.0",
]

# Bib-number OCR
ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.2.2",
    "rapidocr==3.9.1",
    "rapidocr-onnxruntime==1.4.4",
]

# Face detection + ArcFace embeddings.
face = [
    "insightface==1.0.1",
    "onnxruntime==1.27.0",
    "onnxruntime-gpu==1.27.0",
    "numpy",
]

# Optional vision-language model dependencies.
vlm = [
    "transformers==5.12.1",
    "torch",
    "accelerate==1.14.0",
]

[project.scripts]
startnummer = "startnummer.app.manage:main"
startnummer-worker = "startnummer.app.worker:main"
startnummer-api = "startnummer.app.api:main"

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "pytest==9.1.1",
    "import-linter==2.13",
    "mypy==2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["startnummer"]

# Enforces the inward-dependency rule: app -> adapters -> core, never the reverse.
[tool.importlinter]
root_package = "startnummer"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "startnummer.app",
    "startnummer.adapters",
    "startnummer.core",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
