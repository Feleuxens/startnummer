services:
  worker:
    image: ${STARTNUMMER_IMAGE_NAMESPACE:-ghcr.io/feleuxens}/startnummer-worker:nvidia-${STARTNUMMER_IMAGE_TAG:-local}
    build:
      target: worker-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
